<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Managment System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Realistic Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    
    <div class="container">
        <header>
            <div class="logo-icon"><i class="fa-solid fa-book-bookmark"></i></div>
            <h1>Notes Managment System</h1>
            <p>Capture your thoughts, manage your records, and track your days elegantly.</p>
        </header>

        <main class="glass-card">
            <form id="noteForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label><i class="fa-regular fa-calendar-days"></i> Date</label>
                        <input type="date" id="noteDate" required>
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-pen-fancy"></i> Your Note</label>
                        <textarea id="noteText" rows="4" required placeholder="Start writing down your thoughts here..."></textarea>
                    </div>
                </div>

                <button class="btn-submit" type="submit">
                    <i class="fa-solid fa-floppy-disk"></i> <span id="submitBtnText">Save Note</span>
                </button>
            </form>
        </main>

        <section class="list-section">
            <div class="list-header">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> Previous Notes</h3>

                <div class="filter-and-badge">
                    <div class="filter-container">
                        <label class="filter-label"><i class="fa-solid fa-filter"></i> Filter</label>
                        <input type="date" id="filterDate">
                        <button id="clearFilterBtn" class="btn-clear-filter">
                            <i class="fa-solid fa-eraser"></i> Clear
                        </button>
                    </div>
                    <span class="badge" id="totalNotes">0 Notes</span>
                </div>
            </div>

            <div id="notesContainer" class="notes-grid"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
